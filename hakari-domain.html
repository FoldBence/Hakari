<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Idle Death Gamble</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

  :root{
    --void:#0a0810;
    --panel:#141119;
    --line:#2a2333;
    --ember:#c81e3a;
    --ember-dim:#7a1526;
    --gold:#e8a33d;
    --gold-dim:#8a611f;
    --text:#ece6e0;
    --text-dim:#8d8494;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
  }
  html,body{
    margin:0; min-height:100vh; background:var(--void); color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .frame{
    width:100%; max-width:420px;
    border:1px solid var(--line);
    border-radius:4px;
    background:linear-gradient(180deg, #17131f 0%, #0d0a13 100%);
    overflow:hidden;
  }
  .setup{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .setup h1{
    font-family:'Teko',sans-serif; font-weight:600; font-size:22px;
    letter-spacing:0.5px; margin:0 0 4px;
    color:var(--gold);
  }
  .setup p{margin:0 0 14px; font-size:13px; color:var(--text-dim); line-height:1.5;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px;}
  .field input[type=file]{
    width:100%; font-size:12px; color:var(--text-dim);
  }
  .row{display:flex; gap:8px; align-items:center; margin-top:12px;}
  .odds{
    font-size:12px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .odds input{width:52px; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:3px; padding:3px 6px; font-size:12px;}

  button{
    font-family:'Zen Kaku Gothic New',sans-serif;
    cursor:pointer; border:none; border-radius:3px;
    font-size:13px; padding:9px 14px;
    background:var(--panel); color:var(--text); border:1px solid var(--line);
  }
  button:active{transform:translateY(1px);}
  .btn-main{
    background:var(--ember-dim); border-color:var(--ember);
    color:#fff; font-weight:500;
  }
  .btn-main.listening{background:var(--ember); box-shadow:0 0 14px rgba(200,30,58,0.5);}

  .stage{
    position:relative;
    padding:38px 20px 30px;
    text-align:center;
    min-height:260px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring{
    width:150px; height:150px; border-radius:50%;
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:border-color 0.4s, box-shadow 0.4s;
  }
  .ring::before{
    content:''; position:absolute; inset:-8px; border-radius:50%;
    border:1px solid var(--line); opacity:0.5;
  }
  .ring.spin{
    border-color:var(--gold);
    animation:pulse 0.5s infinite alternate;
  }
  .ring.win{
    border-color:var(--gold); box-shadow:0 0 40px rgba(232,163,61,0.55);
  }
  .ring.lose{
    border-color:var(--ember); box-shadow:0 0 24px rgba(200,30,58,0.35);
  }
  @keyframes pulse{ to{ transform:scale(1.06); } }

  .reel{
    font-family:'Teko',sans-serif; font-size:44px; font-weight:600;
    color:var(--text); letter-spacing:2px;
  }
  .reel.spinning{
    animation:blur 0.12s infinite;
    color:var(--gold);
  }
  @keyframes blur{ 0%{opacity:1;} 50%{opacity:0.4;} 100%{opacity:1;} }

  .status{
    margin-top:20px;
    font-family:'Teko',sans-serif; font-size:26px; letter-spacing:1px;
    color:var(--text-dim); min-height:32px;
  }
  .status.win{color:var(--gold);}
  .status.lose{color:var(--ember);}
  .sub{font-size:12px; color:var(--text-dim); margin-top:6px; min-height:16px;}

  .fadebar{
    width:100%; height:2px; background:var(--line); margin-top:22px;
    position:relative; display:none;
  }
  .fadebar.active{display:block;}
  .fadebar > div{
    position:absolute; left:0; top:0; bottom:0; background:var(--gold); width:100%;
  }

  .footer{
    padding:12px 18px 16px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .test-btn{font-size:11px; color:var(--text-dim); background:transparent;}
  .support{font-size:11px; color:var(--text-dim);}
</style>
</head>
<body>

<div class="frame">
  <div class="setup">
    <h1>領域展開 — Idle Death Gamble</h1>
    <p>Töltsd fel a hangfájlokat, engedélyezd a mikrofont, aztán mondd ki: <strong>„ryoiki tenkai”</strong></p>

    <div class="row">
      <button class="btn-main" id="listenBtn">Mikrofon indítása</button>
      <div class="odds">
        Jackpot esély
        <input type="number" id="oddsInput" value="50" min="1" max="99"> %
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="ring" id="ring">
      <div class="reel" id="reel">—</div>
    </div>
    <div class="status" id="status">Várakozás a szóra</div>
    <div class="sub" id="sub"></div>
    <div class="fadebar" id="fadebar"><div id="fadefill"></div></div>
  </div>

  <div class="footer">
    <button class="test-btn" id="testBtn">Kézi teszt (mikrofon nélkül)</button>
    <span class="support" id="support"></span>
  </div>
</div>

<audio id="spinAudio" src="spinning-wheel.mp3" preload="auto"></audio>
<audio id="jackpotAudio" src="TUCA_DONKA_1_HOUR.mp3" preload="none"></audio>

<script>
const IMMORTAL_SECONDS = 4*60 + 11; // 4:11 — Hakari's post-jackpot immortality window, used as fade-out length

const ring = document.getElementById('ring');
const reel = document.getElementById('reel');
const statusEl = document.getElementById('status');
const subEl = document.getElementById('sub');
const listenBtn = document.getElementById('listenBtn');
const testBtn = document.getElementById('testBtn');
const oddsInput = document.getElementById('oddsInput');
const spinAudio = document.getElementById('spinAudio');
const jackpotAudio = document.getElementById('jackpotAudio');
const fadebar = document.getElementById('fadebar');
const fadefill = document.getElementById('fadefill');
const supportEl = document.getElementById('support');

let recognition = null;
let listening = false;
let busy = false; // true while a spin/jackpot sequence is running

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
}

// Fuzzy match: forgives accent/transcription drift on the Japanese phrase
function matchesTrigger(transcript){
  const n = normalize(transcript);
  const hasTenkai = n.includes('tenkai') || n.includes('tenkay');
  const hasRyoiki = n.includes('ryoiki') || n.includes('rioki') || n.includes('rjoki') || n.includes('rjoiki');
  return hasTenkai && hasRyoiki;
}

function setStage(mode, text, sub){
  ring.className = 'ring' + (mode ? ' '+mode : '');
  statusEl.className = 'status' + (mode==='win'?' win':mode==='lose'?' lose':'');
  statusEl.textContent = text;
  subEl.textContent = sub || '';
}

async function runSequence(){
  if(busy) return;
  busy = true;
  if(recognition) recognition.stop();

  setStage('spin', 'PÖRGETÉS', '');
  reel.className = 'reel spinning';
  reel.textContent = '7 7 7';

  const hasSpinSound = !!spinAudio.src;
  if(hasSpinSound){
    spinAudio.currentTime = 0;
    spinAudio.play().catch(()=>{});
    await new Promise(res=>{
      spinAudio.onended = res;
      // safety cap so it can't hang forever if the file is long
      setTimeout(res, 6000);
    });
  } else {
    await new Promise(res=>setTimeout(res, 2200));
  }

  const odds = Math.min(99, Math.max(1, Number(oddsInput.value) || 50)) / 100;
  const win = Math.random() < odds;
  reel.className = 'reel';

  if(win){
    reel.textContent = '7 7 7';
    setStage('win', 'JACKPOT', 'Halhatatlanság: 4:11');
    if(jackpotAudio.src){
      jackpotAudio.volume = 1;
      jackpotAudio.currentTime = 0;
      jackpotAudio.play().catch(()=>{});
      watchFade();
    } else {
      subEl.textContent = 'Nincs feltöltve jackpot zene — csak a jelzés fut le.';
      setTimeout(()=>finish(), 3000);
    }
  } else {
    reel.textContent = '3 1 5';
    setStage('lose', 'NINCS SZERENCSE', '');
    setTimeout(()=>finish(), 1800);
  }
}

function watchFade(){
  fadebar.classList.add('active');
  jackpotAudio.ontimeupdate = ()=>{
    const dur = jackpotAudio.duration || 0;
    const remain = dur - jackpotAudio.currentTime;
    if(!dur) return;
    if(remain <= IMMORTAL_SECONDS){
      const fadeWindow = Math.min(IMMORTAL_SECONDS, dur); // handles tracks shorter than 4:11
      const frac = Math.max(0, remain / fadeWindow);
      jackpotAudio.volume = frac;
      fadefill.style.width = (frac*100)+'%';
      subEl.textContent = 'Halkulás: ' + Math.max(0, Math.floor(remain)) + ' mp';
    }
  };
  jackpotAudio.onended = ()=>{
    fadebar.classList.remove('active');
    finish();
  };
}

function finish(){
  busy = false;
  setStage('', 'Várakozás a szóra', '');
  reel.textContent = '—';
  if(listening && recognition){
    try{ recognition.start(); }catch(e){}
  }
}

function stopAll(){
  spinAudio.pause();
  jackpotAudio.pause();
  fadebar.classList.remove('active');
  busy = false;
}

// --- Speech recognition setup ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){
  supportEl.textContent = 'A böngésződ nem támogatja a hangfelismerést — próbáld Chrome-ban.';
  listenBtn.disabled = true;
} else {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US'; // phonetically closer to the Japanese phrase than hu-HU

  recognition.onresult = (e)=>{
    if(busy) return;
    for(let i=e.resultIndex; i<e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(matchesTrigger(transcript)){
        runSequence();
        break;
      }
    }
  };
  recognition.onerror = (e)=>{
    if(e.error === 'not-allowed'){
      supportEl.textContent = 'Mikrofon-hozzáférés megtagadva.';
      listening = false;
      listenBtn.classList.remove('listening');
      listenBtn.textContent = 'Mikrofon indítása';
    }
  };
  recognition.onend = ()=>{
    if(listening && !busy){
      try{ recognition.start(); }catch(e){}
    }
  };
}

listenBtn.addEventListener('click', ()=>{
  if(!recognition) return;
  if(!listening){
    try{
      recognition.start();
      listening = true;
      listenBtn.classList.add('listening');
      listenBtn.textContent = 'Figyel…';
      supportEl.textContent = '';
    }catch(e){}
  } else {
    listening = false;
    recognition.stop();
    stopAll();
    listenBtn.classList.remove('listening');
    listenBtn.textContent = 'Mikrofon indítása';
    finish();
  }
});

testBtn.addEventListener('click', ()=>runSequence());
</script>

</body>
</html>
